apiVersion: v1
kind: Namespace
metadata:
  name: multiapps
---
apiVersion: v1
kind: Secret
metadata:
  name: agropulse-secrets
  namespace: multiapps
type: Opaque
stringData:
  authSecret: change-me-before-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agropulse-postgres-pvc
  namespace: multiapps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agropulse-db
  namespace: multiapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agropulse-db
  template:
    metadata:
      labels:
        app: agropulse-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: agropulse
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d agropulse"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: agropulse-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agropulse-db
  namespace: multiapps
spec:
  selector:
    app: agropulse-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agropulse-app
  namespace: multiapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agropulse-app
  template:
    metadata:
      labels:
        app: agropulse-app
    spec:
      containers:
        - name: agropulse
          image: agropulse:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@agropulse-db:5432/agropulse
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: agropulse-secrets
                  key: authSecret
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: NEXT_PUBLIC_APP_URL
              value: http://localhost:30000
          command:
            - sh
            - -c
            - npx prisma migrate deploy && npm run start
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agropulse-app
  namespace: multiapps
spec:
  type: NodePort
  selector:
    app: agropulse-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
