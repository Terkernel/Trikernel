apiVersion: v1
kind: ConfigMap
metadata:
  name: polling-db-init
  namespace: multiapps
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS polling_db;
    USE polling_db;

    CREATE TABLE IF NOT EXISTS polls (
        poll_id INT PRIMARY KEY AUTO_INCREMENT,
        question VARCHAR(500) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS options (
        option_id INT PRIMARY KEY AUTO_INCREMENT,
        poll_id INT,
        option_text VARCHAR(300) NOT NULL,
        CONSTRAINT fk_options_poll FOREIGN KEY (poll_id) REFERENCES polls(poll_id) ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS votes (
        vote_id INT PRIMARY KEY AUTO_INCREMENT,
        option_id INT,
        CONSTRAINT fk_votes_option FOREIGN KEY (option_id) REFERENCES options(option_id) ON DELETE CASCADE
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polling-mysql-pvc
  namespace: multiapps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polling-db
  namespace: multiapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polling-db
  template:
    metadata:
      labels:
        app: polling-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: yourpassword
            - name: MYSQL_DATABASE
              value: polling_db
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -uroot -pyourpassword"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: polling-mysql-pvc
        - name: mysql-init
          configMap:
            name: polling-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: polling-db
  namespace: multiapps
spec:
  selector:
    app: polling-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-polling-web
  namespace: multiapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-polling-web
  template:
    metadata:
      labels:
        app: online-polling-web
    spec:
      containers:
        - name: online-polling
          image: online-polling:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: polling-db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: polling_db
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: yourpassword
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: online-polling-web
  namespace: multiapps
spec:
  type: NodePort
  selector:
    app: online-polling-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
---
